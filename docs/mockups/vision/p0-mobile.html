<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стадия 0 — телефон: месяц и событие</title>
<link rel="stylesheet" href="vision.css">
<style>
  body { background: var(--paper); width: 390px; height: 844px; position: relative; overflow: hidden; }
  .top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px 10px; }
  .r1 { display: flex; align-items: center; gap: 10px; }
  .r1 b { font-family: var(--f-display); font-size: 13px; font-weight: 600; display: block; }
  .r1 small { font-size: 11px; color: var(--ink-3); }
  .r1 .sp { flex: 1; }
  .money { text-align: right; }
  .money .num { font-size: 15px; font-weight: 700; display: block; }
  .money small { font-size: 10.5px; }
  .r2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .r2 .speed span { width: 34px; }
  .r2 .date { font-family: var(--f-mono); font-size: 12px; font-weight: 500; flex: 1; }
  .goalm { margin: 12px 14px 0; padding: 11px 13px; border-radius: 12px; background: var(--crust-soft); }
  .goalm .row { display: flex; justify-content: space-between; align-items: baseline; }
  .goalm b { font-family: var(--f-display); font-size: 18px; }
  .goalm .bar { height: 7px; margin-top: 8px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
  .meters3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 14px 0; }
  .m3 { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; }
  .m3 .l { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
  .m3 .l svg { width: 12px; height: 12px; }
  .m3 b { font-family: var(--f-mono); font-size: 15px; }
  .m3 .tr { height: 5px; border-radius: 3px; background: var(--surface-3); margin-top: 4px; position: relative; overflow: hidden; }
  .m3 .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .list { margin: 10px 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
  .li:first-child { border-top: 0; }
  .li .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .li .ic svg { width: 15px; height: 15px; }
  .li small { display: block; color: var(--ink-3); font-size: 11px; }
  .li .v { font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; }
  .dim { position: absolute; inset: 0; background: var(--backdrop); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px 18px; box-shadow: var(--shadow-lg); border-top: 4px solid var(--good); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
  .kick { color: var(--good-t); font-size: 10px; }
  .sheet h2 { font-family: var(--f-display); font-size: 19px; font-weight: 600; line-height: 1.25; margin: 6px 0 10px; }
  .say .tx { font-size: 13.5px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opt { padding: 9px 11px 10px; gap: 2px 10px; }
  .opt .t { font-size: 13.5px; }
  .opt .d { font-size: 12px; }
  .opt .cost { font-size: 12px; }
  .fxc { height: 21px; font-size: 10.5px; }
  .go { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
  .go .btn { height: 44px; font-size: 15px; font-weight: 600; }
  .go .pz { font-size: 11px; color: var(--ink-3); display: inline-flex; gap: 5px; align-items: center; }
  .go .pz svg { width: 10px; height: 10px; }
  .coin { position: absolute; right: 112px; top: 14px; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: #fff; background: var(--good); border-radius: 12px; padding: 3px 10px; box-shadow: var(--shadow); }
  .env { position: absolute; right: 18px; top: -38px; }
</style>
</head>
<body>
  <div class="top">
    <div class="r1"><span id="pp"></span><div><b>Азат · бариста</b><small>«Калач», ул. Пушкина</small></div><span class="sp"></span><div class="money"><span class="num">8 340 ₽</span><small class="muted">на карте</small></div></div>
    <div class="r2"><span class="date">март 2026 · мес. 3</span><span id="sp"></span></div>
  </div>
  <div class="goalm"><div class="row"><span class="caps" style="color:var(--crust-t)">Цель · своя точка</span><span class="num" style="font-size:12px;color:var(--crust-t);font-weight:600">3 %</span></div>
    <div class="row" style="margin-top:3px"><b>41 200 ₽</b><span class="muted" style="font-size:12px">из 1 500 000 ₽</span></div>
    <div class="bar"><i style="width:3%"></i></div></div>
  <div class="meters3" id="m3"></div>
  <div class="list" id="list"></div>

  <div class="dim"></div>
  <div class="coin">+5 000 ₽</div>
  <div class="sheet">
    <div class="grab"></div>
    <svg class="env" width="74" height="54" viewBox="0 0 74 54"><g transform="rotate(-8 37 27)"><rect x="6" y="10" width="62" height="38" rx="3" fill="#fbf4e8" stroke="#2a2320" stroke-width="1.5"/><path d="M6 12 L37 32 L68 12" fill="none" stroke="#2a2320" stroke-width="1.5"/><circle cx="37" cy="31" r="6" fill="var(--bad)"/><path d="M34 31 l2 2 l4 -4" stroke="#fff" stroke-width="1.6" fill="none"/></g></svg>
    <div class="kick" id="kick"></div>
    <h2>Бабушка подарила 5 000 ₽</h2>
    <div class="say"><span id="sania"></span><div><div class="nm">Бабушка Сания<em>в выходном платке</em></div><div class="bub tx">«Вот, пять тысяч. На мечту. Не на кроссовки — на кроссовки я тебе в прошлый раз давала».</div></div></div>
    <div class="opts" id="opts"></div>
    <div class="go"><span class="pz" id="pz"></span><span class="btn primary">Выбрать «А»</span></div>
  </div>
<script src="../icons.js"></script>
<script src="../map.js"></script>
<script src="art.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('pp').innerHTML = ART.portrait('hero', 36);
  $('sania').innerHTML = ART.portrait('sania', 52, { ring: 'var(--good)' });
  const tri = (n) => `<svg width="${6 + n * 6}" height="10" viewBox="0 0 ${6 + n * 6} 10">${Array.from({ length: n }, (_, i) => `<path d="M${i * 6 + 1},1 L${i * 6 + 7},5 L${i * 6 + 1},9Z" fill="currentColor"/>`).join('')}</svg>`;
  $('sp').innerHTML = `<div class="speed">${[IC.pause.replace('<svg', '<svg width="12" height="12"'), tri(1), tri(2)].map((s, i) => `<span class="${i === 0 ? 'on' : ''}">${s}</span>`).join('')}</div>`;
  const m = (ic, l, v, w, c) => `<div class="m3"><span class="l" style="color:${c}">${IC[ic]}<span style="color:var(--ink-2)">${l}</span></span><b>${v}</b><div class="tr"><i style="width:${w}%;background:${c}"></i></div></div>`;
  $('m3').innerHTML = m('heart', 'Силы', 71, 71, 'var(--good)') + m('mood', 'Настроение', 48, 48, 'var(--warn)') + m('star', 'Навык', '1 / 3', 33, 'var(--crust)');
  const li = (ic, n, s, v) => `<div class="li"><span class="ic">${IC[ic]}</span><div>${n}<small>${s}</small></div><span class="v">${v}</span></div>`;
  $('list').innerHTML = li('home', 'Жильё', 'у родителей · Черниковка', '3 000 ₽') + li('guests', 'Еда', 'экономно', '7 500 ₽') + li('bank', 'Вклад «Семь рек»', '17 % годовых', '30 000 ₽') + li('cup', 'Смена в «Калаче»', 'завтра, 7:00', '›');
  $('kick').innerHTML = IC.spark + 'Удача · семья';
  $('pz').innerHTML = IC.pause + 'пауза';
  const O = [
    ['А', '«Положу на вклад, әби. Честно»', 'на вклад под 17 % годовых', '+5 000 ₽', [['save', 1], ['who', 1, 'Семья']], 'sel'],
    ['Б', '«Отдам маме за квартиру»', 'дома месяц без ссор', '0 ₽', [['who', 2, 'Семья'], ['mood', 1]]],
    ['В', '«Кроссовки со скидкой — тоже мечта!»', 'деньги сразу уходят в ТЦ', '−5 000 ₽', [['mood', 2], ['who', -1, 'Семья']]],
  ];
  $('opts').innerHTML = O.map(([l, t, d, c, f, st]) => `<div class="opt ${st || ''}"><span class="L">${l}</span><div><div class="t">${t}</div><div class="d">${d}</div></div><div class="cost">${c}<small>сразу</small></div>${ART.fx(f)}</div>`).join('');
</script>
</body>
</html>
