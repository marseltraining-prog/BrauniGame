      key(S) { const p = prodPick(S); return p && $(`#pbody [data-act="rentProd"][data-arg="${p.best.o.id}"]`); },
      title: 'Цех — не в центре',
      body(S) {
        const p = prodPick(S); if (!p) return '';
        const row = (x) => `<li${x === p.best ? ' class="best"' : ''}><span>${esc(dn(x.o.district))}, до центра ${String(x.toCenter.toFixed(1)).replace('.', ',')} км</span><b>${fm(x.c.total)}</b></li>`;
        return `<p>Цех печёт для всех точек. В центре аренда дороже всего, а экономия на доставке мала — одна-две точки её не окупят. Сравните, во сколько цех обойдётся <b>за 2 года</b> (открытие, аренда, доставка):</p>
          <ul class="tut-list">${p.list.map(row).join('')}</ul>

      key(S) { const n = nextStore(S); return (n.ok && $(`#pbody [data-act="rent"][data-arg="${n.pick.o.id}"]`)) || null; },

      body(S) {

        let rec = '';
        if (n.ok) rec = `<p class="tut-rec">Сейчас подходит: <b>${esc(n.pick.o.address)}</b> — прогноз ≈ <b>${fm(n.pick.est.profit)}/мес</b>${n.loan > 0 ? `; не хватает ${fm(n.loan)} — сначала кредит` : ''}.</p>`;
        else if (n.why === 'cash') rec = '<p class="tut-rec">Сейчас денег на запас не хватает — подождите месяц-другой: выручка растёт, а с ней и кредитный лимит.</p>';
        else if (n.why === 'offers') rec = '<p class="tut-rec">Сейчас на рынке нет помещения с хорошим прогнозом — новые появляются раз в 1–2 недели.</p>';
        return `${rec}<p>Точка в плюсе. Цех рассчитан на 5–8 точек, поэтому с одной точкой сеть в целом в минусе. Следующую открывайте, когда:</p><ul class="tut-list plain"><li>все точки в плюсе за прошлый месяц;</li><li>после аренды останется ≥ ${fm(A.cushion(S))} — можно с кредитом, но не выбирайте лимит до конца;</li><li>третью и дальше — только когда в плюсе вся сеть («Сводка» → «Прибыль»).</li></ul>`;
      },
      acts: (S) => { const n = nextStore(S); return n.ok && n.loan > 0 && A.loanRoom(S) > 0 ? [{ id: 'loan5', label: 'Взять 5 млн', primary: true }] : []; }, ok: 'Понятно' },
    { id: 'final', n: 12, pause: true, trig: (S) => isDone(S, 'second') && (S.stores.length >= 2 || S.day >= 240), target: () => $('.hud .goal'),
      title: 'Дальше — сами',
      body: () => `<ul class="tut-list plain"><li>Больше ${C().HR_REQUIRED_STORES} точек — нужен <b>HR-отдел</b> («Команда»), иначе найм медленный.</li><li>Больше ${C().TRAIN_REQUIRED_STORES} — <b>отдел обучения</b>.</li><li>Цех загружен на 90% — докупайте оборудование («Цех»).</li><li>Кредит погашен и точек 3+ — резерв 10–15%.</li><li>Цель — <b>5 млрд ₽</b> оборота за 12 месяцев.</li></ul><p>Пройти обучение заново — «Меню игры» (шестерёнка).</p>`,
      ok: 'Завершить обучение' },
  ];
  const STEP = {}; STEPS.forEach((s) => { STEP[s.id] = s; });

  /* ---------- выбор текущего шага ---------- */
  function pick(S) {
    const T = st(S);
    if (!isDone(S, 'event') && isDone(S, 'store') && STEP.event.trig(S)) return 'event'; // событие с выбором — вне очереди
    if (T.step && STEP[T.step] && !isDone(S, T.step)) return T.step;
    for (const s of STEPS) {
      if (!s.seq || isDone(S, s.id)) continue;
      if (s.skip && s.skip(S)) { T.done.push(s.id); continue; }
      return s.id;
    }
    for (const id of ['gap', 'first1', 'second', 'final']) if (!isDone(S, id) && STEP[id].trig(S)) return id; // по ситуации — по важности
    return null;
  }

  /* ---------- DOM ---------- */
  let root = null, ring = null, card = null, cur = null, curHtml = '', scrolledFor = null, pausedBy = null, lastCheck = 0, lastDay = -1;
  function build() {
    if (root) return;
    root = document.createElement('div'); root.id = 'tut'; root.className = 'tut'; root.hidden = true;
    root.innerHTML = '<div class="tut-ring" aria-hidden="true"></div><div class="tut-card" role="dialog" aria-modal="false" aria-labelledby="tut-t"><i class="tut-arrow" aria-hidden="true"></i><div class="tut-in"></div></div>';
    document.body.appendChild(root);
    ring = root.querySelector('.tut-ring'); card = root.querySelector('.tut-card');
    card.addEventListener('click', onCardClick);
  }
  function hide() { if (root && !root.hidden) { root.hidden = true; document.documentElement.classList.remove('tut-on'); } }
  function render(S, s) {
    const ui = APP().ui;
    const acts = s.acts ? s.acts(S, ui) : [];
    const html = `<div class="tut-eb"><span>Обучение · шаг ${s.n} из ${TOTAL}</span><span class="tut-dots" aria-hidden="true">${STEPS.map((x) => `<i class="${isDone(S, x.id) ? 'd' : x.id === s.id ? 'c' : ''}"></i>`).join('')}</span></div>
      <h3 id="tut-t">${s.title}</h3><div class="tut-tx">${s.body(S, ui)}</div>
      <div class="tut-f">${acts.map((a) => `<button type="button" class="btn${a.primary ? ' primary' : ''}" data-tut="${a.id}">${a.label}</button>`).join('')}${s.ok ? `<button type="button" class="btn${acts.length || s.okPlain ? '' : ' primary'}" data-tut="ok">${s.ok}</button>` : ''}${s.id === 'final' ? '' : '<button type="button" class="btn ghost" data-tut="skip">Пропустить обучение</button>'}</div>`;
    if (html !== curHtml) { card.querySelector('.tut-in').innerHTML = html; curHtml = html; }
  }
  function onCardClick(e) {
    const b = e.target.closest('[data-tut]'); if (!b) return;
    const S = APP().state; if (!S) return;
    const k = b.dataset.tut, s = STEP[cur];
    if (k === 'skip') { finish(S, true); return; }
    if (k === 'ok') { complete(S, cur); return; }
    if (k === 'loan5') loan5();
    else if (k === 'alloc') { E().setAlloc(S, A.alloc(S)); APP().refresh(); }
    else if (k === 'pay') { for (const kind of ['seller', 'baker']) E().setPay(S, kind, A.payTarget(S, kind)); APP().refresh(); }
    curHtml = ''; lastCheck = 0;
    if (s && s.done && s.done(S, APP().ui)) complete(S, cur);
  }
  function complete(S, id) {
    const T = st(S);
    if (id && T.done.indexOf(id) < 0) T.done.push(id);
    T.step = null; delete T.restart;
    cur = null; curHtml = ''; scrolledFor = null;
    if (id === 'final') { finish(S, false); return; }
    // снять паузу, которую ставило обучение, — если следующий шаг её не требует
    const next = pick(S);
    if (pausedBy && (!next || !STEP[next].pause)) { APP().setSpeed(pausedBy); pausedBy = null; }
    lastCheck = 0; hide();
  }
  function finish(S, skipped) {
    const T = st(S); T.on = false; T.step = null; delete T.restart;
    if (pausedBy) { APP().setSpeed(pausedBy); pausedBy = null; }
    cur = null; curHtml = ''; hide();
    if (skipped) APP().toast('Обучение выключено', 'Включить снова — «Меню игры» (шестерёнка) → «Пройти обучение заново».', 'good');
    else APP().toast('Обучение пройдено', 'Удачи! Цель — 5 млрд ₽ оборота за 12 месяцев.', 'good');
    APP().save();
  }

  /* ---------- позиционирование ---------- */
  const hudH = () => { const h = $('.hud'); return phone() && h ? h.getBoundingClientRect().height : 0; };
  const visibleRect = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? r : null; };
  function ensureVisible(key, fixed) {
    if (!key) return;
    if (!phone()) {
      const r = key.getBoundingClientRect(), sc = key.closest('#pbody, .modal'), box = sc ? sc.getBoundingClientRect() : { top: 0, bottom: innerHeight };
      if (r.top < box.top + 8 || r.bottom > box.bottom - 8) key.scrollIntoView({ block: 'center' });
      return;
    }
    if (fixed) { key.scrollIntoView({ block: 'nearest' }); return; }
    const ch = card.getBoundingClientRect().height, top = hudH() + 10, bottom = innerHeight - ch - 18;
    const r = key.getBoundingClientRect();
    if (r.top >= top && r.bottom <= bottom) return;
    window.scrollBy(0, r.height <= bottom - top ? r.top - top - Math.max(0, (bottom - top - r.height) / 3) : r.bottom - bottom);
  }
  function place(target, key, fixedT) {
    const W = innerWidth, Hh = innerHeight, M = 8, G = 16;
    const tr = target && visibleRect(target);
    if (tr) { const p = 5; Object.assign(ring.style, { display: 'block', left: tr.left - p + 'px', top: tr.top - p + 'px', width: tr.width + 2 * p + 'px', height: tr.height + 2 * p + 'px' }); }
    else ring.style.display = 'none';
    root.classList.toggle('dim', !tr);
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x, y, side = 'none';
    if (phone()) {
      // место под карточкой внизу страницы: иначе последнюю карточку списка нельзя прокрутить выше неё
      const pad = Math.round(ch + 24) + 'px';
      if (document.documentElement.style.getPropertyValue('--tut-pad') !== pad) document.documentElement.style.setProperty('--tut-pad', pad);
      // телефон: карточка прижата к низу; к верху — если нужный элемент в окне внизу (варианты события)
      const kr = (key && visibleRect(key)) || tr;
      const topDock = !!(kr && fixedT && kr.top + kr.height / 2 > Hh / 2);
      x = M; y = topDock ? M : Hh - ch - M;
      card.classList.toggle('top', topDock);
      if (tr) side = topDock ? (tr.top > y + ch ? 'down' : 'none') : (tr.bottom < y ? 'up' : 'none');
    } else if (!tr) { x = (W - cw) / 2; y = (Hh - ch) / 2; }
    else {
      const fits = (a, b) => a >= M && b >= M && a + cw <= W - M && b + ch <= Hh - M;
      const cy = Math.min(Hh - ch - M, Math.max(M, tr.top + tr.height / 2 - ch / 2)), cx = Math.min(W - cw - M, Math.max(M, tr.left + tr.width / 2 - cw / 2));
      const o = [['left', tr.left - G - cw, cy], ['right', tr.right + G, cy], ['up', cx, tr.bottom + G], ['down', cx, tr.top - G - ch]].find((q) => fits(q[1], q[2]));
      if (o) { side = o[0]; x = o[1]; y = o[2]; } else { x = W - cw - M; y = Hh - ch - M; }
    }
    card.style.left = Math.round(x) + 'px'; card.style.top = Math.round(y) + 'px';
    // стрелка смотрит на центр цели
    const ar = card.querySelector('.tut-arrow');
    card.dataset.side = side;
    if (tr && side !== 'none') {
      if (side === 'left' || side === 'right') ar.style.cssText = `top:${Math.round(Math.min(ch - 24, Math.max(12, tr.top + tr.height / 2 - y - 7)))}px;left:${side === 'left' ? cw - 8 : -8}px`;
      else ar.style.cssText = `left:${Math.round(Math.min(cw - 24, Math.max(12, tr.left + tr.width / 2 - x - 7)))}px;top:${side === 'up' ? -8 : ch - 8}px`;
    } else ar.style.cssText = 'display:none';
  }

  /* ---------- цикл ---------- */
  function tick() {
    const app = APP(); if (!app || !app.ui) return;
    const S = app.state, ui = app.ui, startEl = document.getElementById('start');
    if (!on(S) || S.lost || (S.corp && S.corp.active && S.corp.active !== 'ufa') || ui.view === 'russia' || (startEl && !startEl.hidden)) { if (cur && (!S || !on(S))) { cur = null; curHtml = ''; } hide(); return; }
    build();
    const now = performance.now();
    if (now - lastCheck > 250 || S.day !== lastDay || (cur === 'event') !== !!S.ev.pending) {
      lastCheck = now; lastDay = S.day;
      if (cur && STEP[cur].done && STEP[cur].done(S, ui)) { complete(S, cur); return; }
      const id = pick(S);
      if (id !== cur) {
        cur = id; curHtml = ''; scrolledFor = null;
        if (id && id !== 'event') st(S).step = id;
        if (id) {
          const s = STEP[id];
          if (s.start && !ui.modal) s.start(S, ui);
          if (s.pause && ui.speed > 0) { pausedBy = pausedBy || ui.speed; app.setSpeed(0); }
        }
      }
    }
    if (!cur) { hide(); return; }
    const s = STEP[cur];
    // поверх другое окно (итоги года, шеф) — карточку прячем, шаг ждёт
    if ((ui.modal && !s.modal) || (!ui.modal && s.modal)) { hide(); return; }
    render(S, s);
    if (root.hidden) { root.hidden = false; document.documentElement.classList.add('tut-on'); }
    const target = s.target ? s.target(S, ui) : null;
    const key = (s.key && s.key(S, ui)) || target;
    const fixedT = !!(target && target.closest('#modal, .hud'));
    const sk = cur + '|' + ui.tab + '|' + (key ? key.tagName + key.className : '');
    place(target, key, fixedT);
    if (key && scrolledFor !== sk) { scrolledFor = sk; ensureVisible(key, fixedT); place(target, key, fixedT); }
  }
  function loop() {
    try { tick(); } catch (e) { if (!loop.err) { loop.err = 1; console.warn('Обучение:', e && e.message); } } // обучение не должно ронять игру
    requestAnimationFrame(loop);
  }

  /* ---------- стартовый экран, новая игра, меню ---------- */
  function defaultOn() {
    const p = BK.TutPref.get(); if (p != null) return p;
    try { if (BK.Slots) for (let n = 1; n <= BK.Slots.N; n++) if (BK.Slots.info(n)) return false; } catch (e) { /* нет хранилища */ }
    return true; // сохранений нет — скорее всего, новичок
  }
  function startOpt() {
    const v = defaultOn();
    return `<div class="rival-opt tut-opt"><div class="row"><span>Обучение для новичка</span><div class="seg" role="group" aria-label="Обучение для новичка"><button type="button" data-tutopt="1" aria-pressed="${v}">вкл</button><button type="button" data-tutopt="0" aria-pressed="${!v}">выкл</button></div></div><small>Подсказки по шагам в первые месяцы: где поставить цех, как не уйти в минус к 1-му числу и когда открывать вторую точку.</small></div>`;
  }
  function bindStart(el) {
    el.querySelectorAll('[data-tutopt]').forEach((b) => b.addEventListener('click', () => {
      el.querySelectorAll('[data-tutopt]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      BK.TutPref.set(b.dataset.tutopt === '1');
    }));
  }
  const picked = () => { const b = document.querySelector('#start [data-tutopt="1"]'); return b ? b.getAttribute('aria-pressed') === 'true' : defaultOn(); };
  function newGame(S) { S.tutorial = { on: picked(), step: null, done: [] }; cur = null; curHtml = ''; pausedBy = null; }
  function restart() {
    const S = APP().state; if (!S) return;
    S.tutorial = { on: true, step: null, done: [], restart: true };
    cur = null; curHtml = ''; pausedBy = null;
    APP().closeModal(); APP().toast('Обучение запущено', 'Подсказки появятся по шагам.', 'good');
  }
  const settingsHtml = () => '<div class="row sp tut-set"><span>Обучение для новичка</span><button type="button" class="btn" data-act="tutRestart">Пройти обучение заново</button></div>';

  BK.Tutorial = { startOpt, bindStart, newGame, restart, settingsHtml, active: on, STEPS, get current() { return cur; } };
  const boot = () => { if (BK.App && BK.App.ACT) BK.App.ACT.tutRestart = restart; requestAnimationFrame(loop); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot)); else setTimeout(boot);
})();

/* ui/corp-ui.js */
/* Второй акт, этап Р2: интерфейс директоров — цель «Федеральная сеть», «Требует внимания», блоки города (директор, бюджет и цели,
   план/факт), вкладки «Директора», «Отчёты» (входящие с просьбами), «Сравнение городов», окна найма и победы акта.
   Движок — BK.Dir (directors.js). Стиль — макеты docs/mockups/russia-1…4. */
var BK = globalThis.BK || (globalThis.BK = {});
(function () {
  const E = () => BK.Engine, H = () => BK.UIH, C = () => BK.CFG, K = () => BK.CFG.CORP, D = () => BK.Dir;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fm = (v) => BK.fmtMoney(v);
  const cname = (id) => (BK.CITY_BY_ID[id] || {}).name || id;
  const cshort = (id) => { const d = BK.CITY_BY_ID[id] || {}; return d.short || d.name || id; };
  const cin = (id) => (BK.CITY_BY_ID[id] || {}).in || 'в городе ' + cname(id);
  const initials = (n) => String(n || '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const g = (d, m, f) => (d && d.f ? f : m);
  const n1 = (v) => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
  const pc1 = (v) => (v >= 0 ? '+' : '−') + n1(Math.abs(v * 100)) + ' %';
  const MON = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const PRIO = { growth: 'Рост', profit: 'Прибыль', quality: 'Качество' };
  const SKN = { ops: 'Операции', econ: 'Экономия', growth: 'Рост', people: 'Люди' };
  const STN = (s) => ((BK.DIRECTOR_STYLES || {})[s] || {}).name || s;
  const GRN = (gr) => (BK.DIRECTOR_GRADES || [])[gr] || '';
  const TR = (t) => (BK.DIRECTOR_TRAITS || {})[t] || { name: t, desc: '' };
  const on = (S) => !!(S && S.corp && S.corp.unlockedDay != null && BK.Dir);
  const dateTxt = (day) => { const t = E().dateOf(day); return `${t.d} ${E().MONTHS_G[t.m]}`; };

  const av = (name, cls, sub) => `<span class="dav ${cls || ''}" aria-hidden="true">${esc(initials(name))}${sub || ''}</span>`;
  function loyBar(d, big) {
    const L = Math.round(d.loyalty), t = d.loyD || 0, cls = L < 35 ? 'bad' : L < 55 ? 'warn' : 'good';
    const arr = Math.abs(t) < 0.05 ? '' : `<span class="ld ${t > 0 ? 'up' : 'down'}">${t > 0 ? '▲' : '▼'}${big ? ' ' + (t > 0 ? '+' : '−') + n1(Math.abs(t)) + '/мес' : ''}</span>`;
    return `<span class="loy ${cls}${big ? ' big' : ''}" title="Лояльность ${L} из 100"><span class="lm"><i style="width:${L}%"></i></span><b>${L}</b>${arr}</span>`;
  }
  function skillRows(d, cand) {
    const cap = K().DIR_CAP[d.grade];
    return `<div class="dsk">${D().SK.map((k) => { const v = Math.round(cand ? d.seen[k] : d.skills[k]); return `<span class="sn">${SKN[k]}</span><span class="sb"><i style="width:${Math.min(100, v)}%"></i><em style="left:${cap}%" title="Потолок грейда ${cap}"></em></span><b>${cand ? '≈' : ''}${v}</b>`; }).join('')}</div>`;
  }
  const skillMini = (d) => `<span class="dmini" title="${D().SK.map((k) => SKN[k] + ' ' + Math.round(d.skills[k])).join(' · ')}">${D().SK.map((k) => `<i style="height:${Math.max(8, Math.round(d.skills[k]))}%"></i>`).join('')}</span>`;
  function traitChips(S, d, cand) {
    let s = d.traits.map((t) => `<span class="chip" title="${esc(TR(t).desc)}">${esc(g(d, TR(t).name, TR(t).name.replace(/ый$|ий$/, 'ая')))}</span>`).join('');
    const kn = (d.known || []).filter((t) => TR(t).hidden !== false);
    s += kn.map((t) => `<span class="chip bad" title="${esc(TR(t).desc)}">${esc(TR(t).name)}${t === 'theft' && d.caught ? ' · пойман' + g(d, '', 'а') : ''}</span>`).join('');
    if (S.difficulty === 'easy') { if (!kn.length) s += `<span class="chip good" title="На «Лёгком» скрытые черты видны при найме">скрытых черт нет</span>`; }
    else if (d.checked && !kn.length) s += `<span class="chip good" title="Проверка не нашла нарушений (но и не гарантирует их отсутствие)">проверен${g(d, '', 'а')}: нарушений нет</span>`;
    else if (!kn.length) s += `<span class="chip dashed" title="Скрытые черты раскрывают служба безопасности, финансовый департамент, аудит, личный визит в город или проверка при найме">? скрытая черта не проверена</span>`;
    return `<div class="row ru-chips">${s}</div>`;
  }
  const styleChip = (d, c) => { const m = c ? D().match(d, c) : 0; return `<span class="chip ${m > 0 ? 'good' : m < 0 ? 'bad' : ''}" title="${esc(((BK.DIRECTOR_STYLES || {})[d.style] || {}).desc || '')}">Стиль: ${STN(d.style)}${c ? (m > 0 ? ' · совпадает с приоритетом, +5 %' : m < 0 ? ' · против приоритета, −5 %' : '') : ''}</span>`; };

  /* ---------------- цель акта ---------------- */
  function fedMode(S) { return on(S) && (Object.keys(S.corp.cities).length >= 2 || S.won); }
  function fedCard(S) {
    if (!on(S)) return '';
    const f = D().fedStatus(S), h = H();
    const segs = []; for (let i = 0; i < f.need; i++) { const r = f.rows[i]; const p = r ? Math.min(1, r.open / f.per) : 0; segs.push(`<span class="fs${p >= 1 ? ' full' : ''}"><i style="width:${(p * 100).toFixed(0)}%"></i><small>${r && r.open ? esc(cshort(r.id).slice(0, 3)) : ''}</small></span>`); }
    const lack = f.rows.filter((r) => r.open < f.per).sort((a, b) => b.open - a.open)[0];
    const pRev = Math.min(1, f.rev / f.target);
    const top = f.done ? `<span class="gd">взята ${esc(E().fmtDate(S.corp.fed.goalDay))}</span>` : `<span class="gd">${esc(etaFed(S, f))}</span>`;
    let s = `<div class="goalcard fedcard"><div class="top"><span class="caps">Цель акта · Федеральная сеть</span>${top}</div>
      <div class="fr"><span>Города с ${f.per}+ точками</span><b class="big2">${f.cities} <span>из ${f.need}</span></b></div><div class="fsegs">${segs.join('')}</div>
      <div class="fr"><span>Оборот сети за 12 мес.</span><b class="big2">${n1(f.rev / 1e9)} <span>из ${Math.round(f.target / 1e9)} млрд ₽</span></b></div>${h.goalBar(pRev)}
      <div class="foot"><span>${f.done ? (f.legendDone ? '«Лидер рынка» взят' : `«Лидер рынка»: ${n1(f.rev / 1e9)} из ${Math.round(f.legend / 1e9)} млрд`) : lack ? `${esc(cname(lack.id))}: до ${f.per} точек — ${f.per - lack.open}` : 'Нужны новые города'}</span><span>затем «Лидер рынка» · ${Math.round(f.legend / 1e9)} млрд</span></div></div>`;
    return s;
  }
  function etaFed(S, f) { // грубо: при темпе роста оборота сети за год
    const hs = S.history; if (hs.length < 24) return 'прогноз — через год';
    const a = hs.slice(-12).reduce((x, y) => x + y.rev, 0), b = hs.slice(-24, -12).reduce((x, y) => x + y.rev, 0);
    if (!(b > 0) || a <= b) return 'оборот не растёт';
    const gr = Math.min(0.6, a / b - 1), yrs = Math.log(f.target / Math.max(1, f.rev)) / Math.log(1 + gr);
    if (yrs > 25) return 'оборот растёт медленно';
    return yrs <= 0 ? 'оборот взят' : `≈ ${yrs < 1 ? Math.max(1, Math.round(yrs * 12)) + ' мес.' : n1(yrs) + ' г.'} по обороту`;
  }
  // HUD: две полосы «Города» и «Оборот»
  function hudGoal(S) {
    const f = D().fedStatus(S);
    return { k: 'Цель · Федеральная сеть', p: f.done ? 'взята' : `${f.cities}/${f.need}`, v: `${n1(f.rev / 1e9)} / ${Math.round(f.target / 1e9)} млрд`,
      bars: `<div class="hfed"><span>Города</span><span class="hb"><i style="width:${Math.min(100, f.cities / f.need * 100).toFixed(0)}%"></i></span><b>${f.cities}/${f.need}</b><span>Оборот</span><span class="hb"><i style="width:${Math.min(100, f.rev / f.target * 100).toFixed(1)}%"></i></span><b>${n1(f.rev / 1e9)}/${Math.round(f.target / 1e9)}</b></div>` };
  }

  /* ---------------- «Требует внимания» ---------------- */
  function attention(S) {
    const cr = S.corp, out = [];
    for (const id in cr.cities) {
      const c = cr.cities[id]; if (id === cr.active) continue;
      if (!c.directorId) { const st = BK.Corp.cityStats(S, id); out.push({ w: 9, ico: '!', cls: 'bad', t: `${cname(id)}: нет директора`, s: `${H().nw(st.open, 'точка', 'точки', 'точек')} без роста, рейтинг сползает к 3,5★`, act: 'ruHireFor', arg: id, b: 'Назначить', prim: true }); }
    }
    for (const it of cr.inbox) {
      const n = (it.reqs || []).filter((r) => r.st === 'open').length;
      if (n) { const r0 = it.reqs.find((r) => r.st === 'open'); out.push({ w: 7, ico: initials(it.dname), t: `${cname(it.city)}: ${reqTitle(S, it, r0)}`, s: `ответ до ${dateTxt(it.due)} — иначе отказ (−1 лояльности)`, act: 'ruRep', arg: it.id, b: 'Ответить' }); }
      if (it.kind === 'caught' && !it.done) out.push({ w: 10, ico: '!', cls: 'bad', t: it.title, s: 'решите судьбу директора', act: 'ruRep', arg: it.id, b: 'Решить', prim: true });
      if (it.kind === 'award' && !it.done) out.push({ w: 8, ico: '★', cls: 'crust', t: it.title, s: 'выберите лучшего из номинантов', act: 'ruRep', arg: it.id, b: 'Выбрать', prim: true });
    }
    for (const d of cr.directors) {
      if (d.loyalty < 40) out.push({ w: 6, ico: initials(d.name), cls: 'warn', t: `${d.city ? cname(d.city) + ': ' : ''}лояльность падает`, s: `${d.name} · ${Math.round(d.loyalty)}${d.loyD < 0 ? ' ▼' : ''} · оклад ${pc1(d.salary / D().marketPay(S, d, d.city) - 1)} к рынку`, act: 'ruDir', arg: d.id, b: 'Мотивация' });
      if (!d.city) out.push({ w: 5, ico: initials(d.name), t: `${d.name} в резерве`, s: 'получает половину оклада', act: 'ruDir', arg: d.id, b: 'Назначить' });
      else if ((d.poachP || 0) > 0.015 && d.loyalty >= 40) out.push({ w: 5, ico: initials(d.name), cls: 'warn', t: `${cname(d.city)}: директора могут переманить`, s: `${d.name} · ${n1(d.poachP * 100)} % в месяц — оклад, опционы, лояльность`, act: 'ruDir', arg: d.id, b: 'Мотивация' });
      if (d.leaveDay != null && d.city) out.push({ w: 8, ico: initials(d.name), cls: 'bad', t: `${cname(d.city)}: ${d.name} передаёт дела`, s: `уходит ${dateTxt(d.leaveDay)} — найдите замену`, act: 'ruHireFor', arg: d.city, b: 'Замена' });
    }
    for (const id in cr.cities) {
      if (id === cr.active) continue;
      const dv = D().cityDev(S, id); const st = BK.Corp.cityStats(S, id);
      if (dv && dv.dev3 != null && dv.dev3 < -0.05 && cr.cities[id].directorId) out.push({ w: 4, ico: '▼', cls: 'warn', t: `${cname(id)}: выручка ниже прогноза`, s: `${pc1(dv.dev3)} на точку за 3 мес. — воровство, плохие места или слабый директор`, act: 'ruAudit', arg: id, b: 'Аудит' });
      else if (dv && dv.dev3 != null && dv.dev3 < -0.05) out.push({ w: 4, ico: '▼', cls: 'warn', t: `${cname(id)}: выручка ниже прогноза`, s: `${pc1(dv.dev3)} на точку за 3 мес.`, act: 'tab', arg: 'rucmp', b: 'Сравнить' });
      else if (st.lastProfit != null && st.lastProfit < 0 && st.months >= 6) out.push({ w: 3, ico: '₽', cls: 'bad', t: `${cname(id)}: убыток за месяц`, s: fm(st.lastProfit), act: 'tab', arg: 'rucmp', b: 'Сравнить' });
    }
    return out.sort((a, b) => b.w - a.w);
  }
  function attentionHtml(S, max) {
    const a = attention(S); if (!a.length) return '';
    return `<div class="sec"><h3>Требует внимания <em class="badge">${a.length}</em><button class="linkbtn" data-act="tab" data-arg="ruinbox">Отчёты →</button></h3><div class="ratt">${a.slice(0, max || 5).map((x) => `<div class="ra"><span class="dav ${x.cls || ''}">${esc(x.ico)}</span><div class="rt"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></div><button class="btn sm ${x.prim ? 'primary' : ''}" data-act="${x.act}" data-arg="${esc(x.arg)}">${x.b}</button></div>`).join('')}</div></div>`;
  }

  /* ---------------- блоки карточки города ---------------- */
  function cityBlocks(S, id) { // для своего города: директор, бюджет и цели, план/факт
    if (!on(S)) return '';
    const cr = S.corp, c = cr.cities[id]; if (!c) return '';
    const d = D().dirOf(S, c), active = id === cr.active, h = H();
    let s = '';
    if (active) {
      if (d) s += `<div class="dcard mini"><div class="dh">${av(d.name)}<div><b>Заместитель: ${esc(d.name)}</b><span>${GRN(d.grade)} · вы управляете ${d.manualM ? d.manualM + '-й месяц' : 'с этого месяца'}${d.traits.indexOf('executive') < 0 ? ` · после ${K().LOY_MANUAL_GRACE} мес. лояльность −2/мес` : ''}</span></div></div><div class="drow"><span>Лояльность</span>${loyBar(d, true)}</div></div>`;
      return s;
    }
    // директор
    s += `<div class="rsub"><span class="caps">Директор города</span>${d ? `<small>в сети ${h.nw(d.months, 'месяц', 'месяца', 'месяцев')}</small>` : ''}</div>`;
    if (d) {
      s += `<div class="dcard"><div class="dh">${av(d.name, 'lg')}<div><b class="dn">${esc(d.name)}</b><span>${GRN(d.grade)} · грейд ${d.grade}${d.adaptUntil > S.day ? ' · адаптация до ' + dateTxt(d.adaptUntil) : ''}</span></div></div>
        ${skillRows(d)}<div class="row ru-chips">${styleChip(d, c)}</div>${traitChips(S, d)}
        <div class="drow"><span>Лояльность</span>${loyBar(d, true)}</div>
        <div class="drow"><span>Оклад</span><b class="num">${fm(d.salary)}/мес</b></div><div class="hint">Рынок ${fm(D().marketPay(S, d, id))} · ${pc1(d.salary / D().marketPay(S, d, id) - 1)} к рынку</div>
        ${d.study ? `<p class="hint" style="margin:0">Учится: «${esc(BK.CORP_UNI.programs[d.study.prog].name)}» до ${dateTxt(d.study.until)}${d.study.evening ? ' (вечерний формат)' : ' — выручка города −3 %'}.</p>` : ''}${d.absentUntil > S.day ? `<p class="hint warnc" style="margin:0">В отпуске до ${dateTxt(d.absentUntil)}: город «без директора».</p>` : ''}${id !== d.city ? `<p class="hint" style="margin:0">Региональный директор: основной город — ${esc(cname(d.city))}, здесь навыки ×0,75.</p>` : ''}
        <div class="row dbtns"><button class="btn sm primary" data-act="ruDir" data-arg="${d.id}">Мотивация</button><button class="btn sm" data-act="ruHireFor" data-arg="${id}">Сменить</button>${H().btn('ruAudit', 'Аудит', { cls: 'sm', arg: id, cost: BK.HQ.auditCost(S, id), dis: S.cash < BK.HQ.auditCost(S, id), title: 'Внешний аудит: раскроет воровство с шансом 70 %, приукрашивание — 80 %. Честный директор обидится (−3, второй аудит за год — ещё −5).' })}</div></div>`;
    } else {
      const res = cr.directors.filter((x) => !x.city);
      s += `<div class="dcard none"><div class="dh"><span class="dav bad">!</span><div><b>Нет директора</b><span>Город только живёт: новых точек нет, найм из вашего лимита, рейтинг сползает к 3,5★, выручка × 0,95.</span></div></div>
        <div class="row dbtns"><button class="btn sm primary" data-act="ruHireFor" data-arg="${id}">${res.length ? 'Назначить директора' : 'Нанять директора'}</button></div></div>`;
    }
    // конкуренты: местные сети и федеральный «Хлебный двор»
    if (id !== 'ufa') { const p = c.pressure || 0; s += `<div class="drow"><span>Давление конкурентов</span><b class="num">${n1(p)}${p ? ` · выручка ≈ −${n1(p * K().PRESS_K * 100)} %` : ''}</b></div><p class="hint" style="margin:0">Местные сети (конкуренция ${esc((BK.CITY_COMP[(BK.CITY_BY_ID[id] || {}).comp] || {}).name || '')})${c.rivalIn ? ` и «${esc(C().RIVAL_NAME)}» — с ${esc(E().fmtDate(c.rivalIn))}` : ''}. Сильнее бьёт по точкам с низким рейтингом.</p>`; }
    // план / факт
    if (d && c.plan) {
      const st = BK.Corp.cityStats(S, id), pf = D().planFact(S, c);
      const rows = c.hist.filter((x) => x[0] === c.plan.y && E().dateOf(c.plan.from).m <= x[1]);
      const rev = rows.reduce((a, x) => a + x[2], 0), prof = rows.reduce((a, x) => a + x[3], 0), planRev = c.plan.monthRev * Math.max(1, rows.length);
      const bar = (p, cls) => `<span class="pfb ${cls}"><i style="width:${Math.min(100, p * 100).toFixed(0)}%"></i><em style="left:${Math.min(100, (rows.length ? rows.length : 1) / Math.max(1, 12 - E().dateOf(c.plan.from).m) * 100).toFixed(0)}%"></em></span>`;
      const tone = (p) => (p >= 0.98 ? 'good' : p >= 0.9 ? 'warn' : 'bad');
      const pSt = st.stores / Math.max(1, c.plan.stores), mg = rev > 0 ? prof / rev : 0;
      s += `<div class="rsub"><span class="caps">План / факт ${c.plan.y}</span><small>| — где должны быть сейчас</small></div><div class="pf">
        <span>Точки</span>${bar(pSt, tone(pSt + 0.1))}<b>${st.stores} из ${c.plan.stores}</b>
        <span>Выручка</span>${bar(pf != null ? rev / (c.plan.monthRev * 12 / 1) : 0, tone(pf || 1))}<b>${fm(rev)} · ${pf != null ? Math.round(pf * 100) + ' %' : '—'}</b>
        <span>Маржа</span>${bar(Math.max(0, mg) / Math.max(0.05, c.plan.margin), tone(mg + 0.02 >= c.plan.margin ? 1 : 0.9))}<b>${h.pctS(mg, true)} · план ${h.pctS(c.plan.margin, true)}</b></div>`;
      void planRev;
    }
    // бюджет и цели
    const b = c.budget, pk = c.payK || 1;
    const stp = (arg2, lab, dis) => `<button class="btn sm stp" data-act="ruBudget" data-arg="${id}" data-arg2="${arg2}"${dis ? ' disabled' : ''} aria-label="${lab}">${arg2.endsWith('-') ? '−' : '+'}</button>`;
    s += `<div class="rsub"><span class="caps">Бюджет и цели</span><small>${d ? 'по умолчанию — предложение директора' : 'без директора не тратится'}</small></div><div class="bud">
      <div class="bl"><span>Капвложения на год</span><span class="bv">${stp('capex-', 'Меньше')}<b>${fm(b.left)} / ${fm(b.capex)}</b>${stp('capex+', 'Больше')}</span></div>
      <div class="bl"><span>Зарплаты персонала</span><span class="bv">${stp('pay-', 'Ниже', pk <= 0.905)}<b>${pk >= 1 ? '+' : '−'}${Math.round(Math.abs(pk - 1) * 100)} % к рынку</b>${stp('pay+', 'Выше', pk >= 1.245)}</span></div>
      <div class="bl"><span>Обучение персонала</span><span class="bv">${stp('train-', 'Ниже', b.train <= 1)}<b>до уровня ${b.train}</b>${stp('train+', 'Выше', b.train >= 5)}</span></div>
      <div class="bl"><span>Новые точки</span><span class="seg sm" role="group"><button type="button" data-act="ruBudget" data-arg="${id}" data-arg2="open1" aria-pressed="${b.open !== false}">открывать</button><button type="button" data-act="ruBudget" data-arg="${id}" data-arg2="open0" aria-pressed="${b.open === false}">нет</button></span></div>
      <div class="bl"><span>Убыточные точки</span><span class="seg sm" role="group"><button type="button" data-act="ruBudget" data-arg="${id}" data-arg2="close1" aria-pressed="${!!b.close}">закрывает сам</button><button type="button" data-act="ruBudget" data-arg="${id}" data-arg2="close0" aria-pressed="${!b.close}">спросит</button></span></div>

  function dirDetail(S, d, c) {

    el.addEventListener('click', () => { el.remove(); if (onClick && S) onClick(); });
    if (onClick) el.title = 'Открыть точку';
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();

    setTimeout(() => el.remove(), effects ? 9000 : 6000);

    if (ev.choices) {
      // бесплатный вариант доступен всегда (даже при минусе на счёте), иначе игрок застревает в окне;
      // если по деньгам не проходит ничего — открыт самый дешёвый вариант (уйдёт в минус, как и прочие платежи)
      const afford = (c) => !c.dis && (!c.cost || c.cost <= S.cash + S.reserve); // c.dis — корпоративный выбор без нужного отдела штаба / грейда
      const cheapest = ev.choices.some(afford) ? -1 : ev.choices.reduce((b, c, i) => (!c.dis && (ev.choices[b].dis || c.cost < ev.choices[b].cost) ? i : b), 0);
      ev.choices.forEach((c, i) => {
        const can = afford(c) || i === cheapest;
        html += `<button class="choice" data-choice="${i}"${can ? '' : ' disabled'}${c.dis ? ` title="${H.esc(c.dis)}"` : ''}><b>${H.esc(c.label)}</b><span class="cd">${H.esc(c.desc || '')}${c.dis ? ` <em class="negc">${H.esc(c.dis)}.</em>` : ''}</span><span class="cc">${c.cost ? H.fm(c.cost) : 'бесплатно'}</span></button>`;
      });
    } else html += `<button class="btn primary block" data-choice="-1">Понятно</button>`;
    html += `</div>`;
    openModal(html);
    $('#modal').querySelectorAll('[data-choice]').forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.choice;
      if (ev.choices) { const c = ev.choices[i]; if (c.cost > 0 && c.cost > S.cash) E.reserveMove(S, -(c.cost - S.cash)); }
      E.resolveEvent(S, i < 0 ? 0 : i);
      closeModal(); save();
    }));
  }

      for (const id of S.chef.pending) {

          <span class="cm"><span>цена ${H.n0(p.price * pl)} ₽</span><span>фудкост ${H.pct(p.fc)}</span><span>тренд ${Math.round(S.trends[p.cat])}</span><span>популярность ${p.pop}</span>${ok ? '' : `<span class="negc">нужно: ${H.esc(reqName)}</span>`}</span></label>`;
      }

      }
      html += `</div></div><div class="modal-f"><div class="row sp"><span class="hint">В меню станет ${H.nw(after, 'позиция', 'позиции', 'позиций')} (от ${C.MENU_MIN} до ${C.MENU_MAX})</span><button class="btn primary" id="chefOk" ${after < C.MENU_MIN || after > C.MENU_MAX ? 'disabled' : ''}>Утвердить меню</button></div></div>`;
      openModal(html, { keepScroll: true });
      $('#modal').querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('change', () => { const id = b.dataset.pick; if (b.checked) { if (pick.size >= C.CHEF_PICK) { b.checked = false; return; } pick.add(id); } else pick.delete(id); draw(); }));
      $('#modal').querySelectorAll('[data-drop]').forEach((b) => b.addEventListener('change', () => { const id = b.dataset.drop; if (b.checked) { if (drop.size >= C.CHEF_REMOVE) { b.checked = false; return; } drop.add(id); } else drop.delete(id); draw(); }));
      $('#chefOk').addEventListener('click', () => { const r = E.chefConfirm(S, [...pick], [...drop]); if (!r.ok) { toast('Не получилось', r.msg, 'warn'); return; } closeModal(); save(); });
    };

      <p style="margin:0"><b>Меню.</b> Раз в год шеф предлагает 5 новинок: можно добавить до ${C.CHEF_PICK} и вывести до ${C.CHEF_REMOVE}. Цены меняйте в любой момент. Следите за фудкостом — долей себестоимости продуктов в цене.</p>
      <p style="margin:0"><b>Деньги.</b> Зарплаты, аренду и налоги списывают 1-го числа. Резервный фонд приносит проценты и сам закрывает кассовый разрыв. Если ${H.nw(C.BANKRUPT_MONTHS, 'расчёт', 'расчёта', 'расчётов')} подряд счёт в минусе, а резерв пуст, — банкротство.</p>
      <p style="margin:0"><b>Термины.</b> ФОТ — фонд оплаты труда: зарплаты плюс взносы. УСН — упрощённый налог с выручки; когда выручка за год превысит лимит, сеть перейдёт на ОСНО (НДС и налог на прибыль). Кассовый разрыв — на счёте не хватает денег на платежи.</p>
      <p style="margin:0"><b>События:</b> налоги, проверки, конкуренты, погода, кризис раз в 2–3 года. 70% из них — неприятные.</p>
      <p class="hint" style="margin:0">Клавиши: пробел — пауза, 1 / 2 / 3 — скорость.</p>
      </div><div class="modal-f"><button class="btn primary block" data-act="closeModal">Понятно</button></div>`, { closable: true });
  }
  function openSettings() {
    openModal(`<div class="modal-h"><span class="eyebrow">Меню игры</span><h2>${H.esc(S.company)}</h2></div><div class="modal-b">
      <div class="row sp settings-top"><div class="field"><span class="flabel">Тема оформления</span>${themeSeg()}</div><button class="btn" data-act="help">Как играть</button></div>
      <div class="field"><label for="renameIn">Название сети</label><div class="row"><input id="renameIn" class="input" style="flex:1" maxlength="40" value="${H.esc(S.company)}"><button class="btn" id="renameOk">Сохранить</button></div></div>
      <div class="row sp"><span>Уровень сложности</span><b class="diffbadge ${S.difficulty || 'normal'}">${diffName(S.difficulty)}</b></div>
      ${BK.Extras ? BK.Extras.settingsHtml(S) : ''}
      ${BK.Tutorial ? BK.Tutorial.settingsHtml(S) : ''}
      <p class="hint" style="margin:0">Игра сама сохраняется в этом браузере каждый месяц. Чтобы перенести игру на другое устройство, скопируйте код сохранения и вставьте его там.</p>
      <div class="field"><label for="saveCode">Код сохранения</label><textarea id="saveCode" class="input" rows="3" style="font-family:var(--f-mono);font-size:11px;resize:vertical" placeholder="Вставьте код, чтобы загрузить игру"></textarea></div>
      <div class="row"><button class="btn" id="copyCode">Скопировать код</button><button class="btn" id="loadCode">Загрузить из кода</button></div>
      <div id="newConfirm"></div>
      </div><div class="modal-f"><button class="btn primary block" data-act="closeModal">Вернуться в игру</button><button class="btn danger block" id="newGameBtn">Новая игра</button></div>`, { closable: true });
    $('#renameOk').addEventListener('click', () => { S.company = $('#renameIn').value.trim() || S.company; hudCache = ''; save(); toast('Название сохранено', S.company, 'good'); });
    $('#copyCode').addEventListener('click', () => {
      const code = exportCode(); const ta = $('#saveCode'); ta.value = code;
      navigator.clipboard && navigator.clipboard.writeText(code).then(() => toast('Код скопирован', '', 'good'), () => { ta.select(); toast('Выделите и скопируйте код', '', 'warn'); });
      if (!navigator.clipboard) { ta.select(); }
    });
    $('#loadCode').addEventListener('click', () => { try { const st = importCode($('#saveCode').value); continueGame(st); save(); toast('Игра загружена', '', 'good'); } catch (e) { toast('Код не подошёл', 'Проверьте, что он скопирован целиком.', 'bad'); } });
    $('#newGameBtn').addEventListener('click', () => {
      $('#newConfirm').innerHTML = `<div class="confirm">Эта игра останется в своём слоте. Новую можно начать в свободном слоте или вместо любой игры. <button class="btn sm danger" id="newYes">К списку игр</button></div>`;
      $('#newYes').addEventListener('click', toStart);
    });
  }

  function toStart() { save(); closeModal(); cityView(); S = null; startScreen(); } // к списку игр: текущая остаётся в своём слоте

  /* ---------------- запуск ---------------- */
  function boot(hot) {
    applyTheme(loadTheme());
    shell();
    applyTheme(ui.theme);
    if (hot && hot.state) { continueGame(hot.state); ui.speed = hot.speed != null ? hot.speed : 1; }
    else startScreen();
    requestAnimationFrame(frame);
    if (globalThis.claude && globalThis.claude.hot && globalThis.claude.hot.snapshot) {
      try { globalThis.claude.hot.snapshot(() => (S ? { state: stripState(S), speed: ui.speed } : {})); } catch (e) {}
    }
  }
  BK.App = { boot, get state() { return S; }, ui, ACT, save, setSpeed, openModal, closeModal, toast, newGame, continueGame, toStart, openRussia, cityView, refresh };
  const h = globalThis.claude && globalThis.claude.hot;
  if (h && h.ready) h.ready(boot); else boot(h && h.data ? h.data : null);
})();

</script>
