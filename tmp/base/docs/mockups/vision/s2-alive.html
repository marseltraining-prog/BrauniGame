<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Стадия 2 «Сеть в Уфе» — живая карта</title>
<link rel="stylesheet" href="vision.css">
<style>
  body { background: var(--paper); }
  .app { display: grid; grid-template-rows: 64px 1fr; height: 100vh; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
  .mapwrap { position: relative; overflow: hidden; background: var(--map-land); }
  .mapwrap > svg { position: absolute; inset: 0; }
  .chips { position: absolute; left: 16px; top: 14px; display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); z-index: 3; }
  .chips span { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .chips span svg { width: 15px; height: 15px; }
  .chips span.on { background: var(--ink); color: var(--surface); }
  .thought { z-index: 3; font-size: 11.5px; }
  .pop { z-index: 3; }
  .lens { position: absolute; z-index: 4; left: 532px; top: 432px; width: 452px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .lens .hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .lens .hd b { font-size: 13.5px; display: block; }
  .lens .hd small { font-size: 11.5px; color: var(--ink-3); }
  .lens .hd .n { width: 28px; height: 28px; border-radius: 50%; border: 2.4px solid var(--good); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; font-weight: 700; }
  .lens .hd .x { margin-left: auto; display: flex; gap: 6px; }
  .lens svg.dio { display: block; }
  .lens .st { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .lens .st div { padding: 7px 12px 8px; border-left: 1px solid var(--line); }
  .lens .st div:first-child { border-left: 0; }
  .lens .st .caps { font-size: 8.5px; }
  .lens .st b { font-family: var(--f-mono); font-size: 13px; display: block; margin-top: 1px; }
  .lens .st b.w { color: var(--warn-t); }
  .lens .tip { display: flex; gap: 8px; align-items: center; padding: 8px 14px 10px; font-size: 12px; background: var(--warn-soft); color: var(--warn-t); }
  .lens .tip svg { width: 14px; height: 14px; flex: none; }
  .lens .tip .btn { margin-left: auto; height: 26px; }
  .zoomline { position: absolute; z-index: 3; }
  .plate { left: 24px; bottom: 24px; width: 250px; z-index: 3; }
  .ribbon { position: absolute; z-index: 3; display: inline-flex; align-items: center; gap: 6px; background: var(--crust); color: #fff; font-family: var(--f-display); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; padding: 5px 10px; border-radius: 6px; box-shadow: 0 3px 0 var(--crust-t); text-transform: uppercase; }
  .ribbon svg { width: 13px; height: 13px; }

  aside { min-width: 0; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .pane { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .quest { border-radius: 14px; border: 1.5px solid var(--crust); background: linear-gradient(160deg, var(--crust-soft), var(--surface) 70%); padding: 14px 16px; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .quest .caps { color: var(--crust-t); }
  .quest h3 { font-family: var(--f-display); font-size: 16px; font-weight: 600; line-height: 1.25; margin: 5px 0 6px; }
  .quest .rw { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .quest .rw svg { width: 14px; height: 14px; color: var(--crust-t); flex: none; }
  .ql { display: flex; flex-direction: column; gap: 8px; }
  .qi { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
  .qi .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
  .qi .ic svg { width: 15px; height: 15px; }
  .qi b { font-weight: 600; display: block; }
  .qi .pb { height: 5px; border-radius: 3px; background: var(--surface-3); margin-top: 4px; position: relative; overflow: hidden; }
  .qi .pb i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 3px; }
  .qi .v { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .tl { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; font-size: 12px; padding: 4px 0; }
  .tl .b { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; border: 1.3px solid var(--ink); border-radius: 12px; padding: 2px 9px 2px 7px; background: var(--surface); justify-self: start; }
  .tl .b svg { width: 12px; height: 12px; }
  .tl .b.good { color: var(--good-t); } .tl .b.bad { color: var(--bad-t); } .tl .b.warn { color: var(--warn-t); }
  .tl .bar2 { height: 6px; border-radius: 3px; background: var(--surface-3); position: relative; }
  .tl .bar2 i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .tl .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); min-width: 76px; text-align: right; }
  .sound { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 12px; }
  .sound .chip { gap: 6px; } .sound .chip svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<div class="app">
  <div id="hud"></div>
  <div class="main">
    <div class="mapwrap" id="mw">
      <svg id="map" width="1000" height="836" viewBox="0 0 1000 836"></svg>
      <div class="chips" id="chips"></div>
      <div class="lens" id="lens"></div>
      <div class="plate"><div class="h"><span class="caps">Генплан сети</span><b>УФА · ЛИСТ 1</b></div>
        <div class="r"><div><span class="caps">Точек</span><span class="mono">9 · цех 1</span></div><div><span class="caps">Дата</span><span class="mono">14.03.2030</span></div></div></div>
    </div>
    <aside>
      <nav class="tabs"><span class="on">Сводка</span><span>Точки</span><span>Команда</span><span>Финансы</span><span>Рынок</span></nav>
      <div class="pane">
        <div class="quest" id="quest"></div>
        <div><div class="sec-h"><h3>Ещё вехи</h3><span class="muted">каждые 3–5 минут</span></div><div class="ql" id="ql"></div></div>
        <div><div class="sec-h"><h3>Мысли гостей · неделя</h3><span class="muted">вся сеть</span></div><div id="tl"></div></div>
        <div><div class="sec-h"><h3>Как читать живую карту</h3><span class="muted">без цифр</span></div><div id="how" style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12px;color:var(--ink-2)"></div></div>
        <div class="sound" id="snd"></div>
      </div>
    </aside>
  </div>
</div>
<script src="../icons.js"></script>
<script src="../map.js"></script>
<script src="art.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const INK = ART.INK;
  $('hud').innerHTML = ART.hud({
    brand: 'Сеть «Тёплый угол»', sub: 'Хлебная карта', date: '14 марта 2030', speed: 1,
    metrics: [
      { l: 'Счёт', v: '38,6 млн ₽', spark: [22, 25, 24, 28, 30, 29, 33, 35, 34, 36, 37, 38.6], d: '▲ 4,1 % за мес.', dc: 'up' },
      { l: 'Выручка, фев.', v: '21,4 млн ₽', spark: [15, 16, 16.5, 17, 18, 17.6, 18.8, 19.5, 19.2, 20.4, 20.8, 21.4], d: '▲ 2,9 % к янв.', dc: 'up' },
      { l: 'Точки', v: '9', extra: '<span class="moodbar"><i style="width:78%;background:var(--face-happy)"></i><i style="width:17%;background:var(--face-mid)"></i><i style="width:5%;background:var(--face-sad)"></i></span>', d: '+1 сегодня' },
    ],
    goal: { l: 'К цели · 5 млрд', pct: 5.1, v: '256 млн ₽', note: 'за 12 мес.', ms: [20, 50, 80], w: 220 },
  });
  const tri = (ic, t, on) => `<span class="${on ? 'on' : ''}">${ic}${t}</span>`;
  $('chips').innerHTML = tri(IC.rub, 'Прибыль') + tri(IC.mood, 'Настроение') + tri(IC.guests, 'Живая карта', true) + tri(IC.clock, 'Время суток');

  // ---- карта: основа + свои точки ----
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  MK.render(tmp, { vb: [-60, -20, 1120, 1040], clusters: false, routes: false, id: 'a' });
  tmp.querySelectorAll('.m-pt,.m-cl,.m-prod,.m-hq,.m-offer,.m-alert,.m-route').forEach((e) => e.remove());
  const T = { tx: -187, ty: -289, s: 1.1 };
  const P = (x, y) => [T.tx + x * T.s, T.ty + y * T.s];
  const PTS = [
    [1, 356, 792, 'happy', 3], [2, 488, 702, 'happy', 2], [3, 560, 628, 'mid', 4], [4, 404, 826, 'happy', 1], [5, 700, 650, 'happy', 2],
    [6, 612, 480, 'mid', 3], [7, 440, 486, 'sad', 0], [8, 612, 760, 'happy', 1], [9, 200, 740, 'happy', 2],
  ];
  const MC = { happy: 'var(--face-happy)', mid: 'var(--face-mid)', sad: 'var(--face-sad)' };
  const RV = [[380, 772], [540, 590], [620, 450], [700, 610], [420, 470], [120, 890], [470, 920], [640, 740], [520, 300], [300, 640], [760, 540], [660, 520], [330, 860], [580, 820]];
  let o = '';
  // маршруты от цеха
  const PROD = [668, 520];
  PTS.forEach(([n, x, y]) => { o += `<line class="m-route" x1="${PROD[0]}" y1="${PROD[1]}" x2="${x}" y2="${y}"/>`; });
  RV.forEach(([x, y]) => { o += `<rect x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="translate(${x},${y}) rotate(45)" fill="var(--rival)" fill-opacity=".6" stroke="var(--paper)" stroke-width="1.4"/>`; });
  o += `<g class="m-prod" transform="translate(${PROD[0]},${PROD[1]})"><rect x="-12" y="-12" width="24" height="24" rx="4"/><path d="M-7,6 L-7,-2 L-3,-5 L-3,-1 L1,-4 L1,0 L5,-3 L5,-7 L7,-7 L7,6 Z"/></g>`;
  o += ART.steam(PROD[0] + 6, PROD[1] - 14, .55, .5);
  // человечки-очередь у точки: число = загрузка
  const pawn = (x, y, c) => `<g transform="translate(${x},${y})"><rect x="-3.4" y="-3" width="6.8" height="8" rx="3.2" fill="${c}" stroke="${INK}" stroke-width=".8"/><circle cx="0" cy="-6" r="3" fill="#efc9a4" stroke="${INK}" stroke-width=".8"/></g>`;
  const PC = ['#3b6fb0', '#e5b53c', '#2c8a57', '#9580a8', '#c46f17'];
  PTS.forEach(([n, x, y, m, q]) => {
    for (let i = 0; i < q; i++) o += pawn(x - 20 - i * 8.5, y + 13, PC[(n + i) % 5]);
    o += `<g class="m-pt" transform="translate(${x},${y})"><circle class="b" r="11.5" stroke="${MC[m]}"/><text>${n}</text></g>`;
  });
  // №10 — открытие сегодня
  o += `<g class="m-pt" transform="translate(300,560)"><circle r="18" fill="var(--crust)" opacity=".18"/><circle class="b" r="11.5" stroke="var(--crust)" stroke-dasharray="3 2"/><text>10</text></g>`;
  // выделение №3 (линза)
  o += `<circle cx="560" cy="628" r="20" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;
  $('map').innerHTML = `<g transform="translate(${T.tx},${T.ty}) scale(${T.s})">${tmp.innerHTML}${o}</g>`;
  // линия от точки к линзе
  const [lx, ly] = P(560, 628);
  $('mw').insertAdjacentHTML('beforeend', `<svg class="zoomline" style="left:0;top:0" width="1000" height="836"><path d="M${lx + 14},${ly + 12} L532,${452}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></svg>`);
  // мысли гостей над точками
  const th = (n, cls, ic, t, dx, dy, r) => { const p = PTS.find((q) => q[0] === n); const [x, y] = P(p[1], p[2]); return `<span class="thought ${cls}${r ? ' r' : ''}" style="left:${x + dx}px;top:${y + dy}px">${IC[ic]}${t}</span>`; };
  $('mw').insertAdjacentHTML('beforeend',
    th(1, 'good', 'heart', 'вкусно!', -40, -54) + th(7, 'bad', 'rub', 'дорого', -24, -54) + th(6, 'warn', 'clock', 'очередь', -14, -56) +
    th(9, 'warn', 'guests', 'нет моих круассанов', -6, -56) + th(5, 'good', 'star', 'как дома', -20, -54));
  const [px, py] = P(404, 826);
  $('mw').insertAdjacentHTML('beforeend', `<span class="pop" style="left:${px - 112}px;top:${py - 16}px">+4 820 ₽</span>`);
  const [rx, ry] = P(300, 560);
  $('mw').insertAdjacentHTML('beforeend', `<span class="ribbon" style="left:${rx - 64}px;top:${ry + 18}px">${IC.bell}Дзынь! №10 открыта</span>`);

  // ---- линза: «живая точка» вблизи ----
  const dio = () => {
    let s = `<rect width="452" height="236" fill="var(--warm)"/><rect y="186" width="452" height="50" fill="var(--paper-2)"/><path d="M0 186H452" stroke="${INK}" stroke-width="1.3"/>`;
    s += `<rect x="150" y="28" width="286" height="160" fill="#f3ece0" stroke="${INK}" stroke-width="1.4"/>`;
    s += `<rect x="164" y="10" width="258" height="26" rx="4" fill="var(--ink)"/><text x="293" y="28" text-anchor="middle" font-family="var(--f-display)" font-size="12" font-weight="700" fill="#fbf4e8" letter-spacing=".14em">ТЁПЛЫЙ УГОЛ · №3</text>`;
    s += `<path d="M146 40 H440 V54 ${Array.from({ length: 10 }, () => 'a14.7,10 0 0 1 -29.4,0').join(' ')} Z" fill="url(#aw2)" stroke="${INK}" stroke-width="1.3"/>`;
    s += `<rect x="168" y="70" width="170" height="100" rx="3" fill="#dcebec" stroke="${INK}" stroke-width="1.3"/>`;
    // продавцы за стеклом (одна устала)
    s += ART.person(212, 150, { s: .95, shirt: '#f4efe6', apron: 'var(--crust)', hair: 'bun', hc: '#3a2a20', mood: 'happy' });
    s += ART.person(290, 150, { s: .95, shirt: '#f4efe6', apron: 'var(--crust)', hair: 'short', hc: '#2d211a', mood: 'ok', sweat: true });
    s += `<rect x="168" y="138" width="170" height="32" fill="#b07a4f" stroke="${INK}" stroke-width="1.2"/>`;
    s += ART.pastry('loaf', 190, 132, .8) + ART.pastry('croissant', 222, 133, .75) + ART.pastry('echpochmak', 252, 132, .75) + ART.pastry('bun', 282, 133, .7) + ART.pastry('loaf', 314, 132, .8);
    s += ART.steam(190, 118, .5, .5) + ART.steam(314, 118, .5, .5);
    // дверь
    s += `<rect x="352" y="80" width="68" height="106" rx="3" fill="#8a5a3a" stroke="${INK}" stroke-width="1.3"/><rect x="360" y="90" width="52" height="46" fill="#dcebec" stroke="${INK}" stroke-width="1"/><circle cx="408" cy="146" r="2.4" fill="#e2b24a"/>`;
    // очередь снаружи
    [[132, '#3b6fb0', 'cap', 'ok'], [100, '#e5b53c', 'long', 'ok'], [68, '#2c8a57', 'short', 'sad'], [36, '#9580a8', 'bun', 'ok']].forEach(([x, c, h, m]) => { s += ART.person(x, 220, { s: .95, shirt: c, hair: h, hc: '#3a2a20', mood: m }); });
    // курьер агрегатора
    s += `<g transform="translate(404,224)"><circle cx="-18" cy="-6" r="9" fill="none" stroke="${INK}" stroke-width="2"/><circle cx="20" cy="-6" r="9" fill="none" stroke="${INK}" stroke-width="2"/><path d="M-18,-6 L-4,-24 L12,-24 L20,-6 M-4,-24 L2,-6" stroke="${INK}" stroke-width="2" fill="none"/></g>`;
    s += ART.person(404, 206, { s: .8, shirt: '#2c8a57', pants: '#3a4254', hair: 'cap', hc: '#2c8a57', mood: 'ok' });
    s += `<rect x="410" y="152" width="22" height="20" rx="3" fill="#6fbf73" stroke="${INK}" stroke-width="1.2"/>`;
    return `<defs><pattern id="aw2" width="29.4" height="10" patternUnits="userSpaceOnUse"><rect width="14.7" height="10" fill="var(--crust)"/><rect x="14.7" width="14.7" height="10" fill="#fbf4e8"/></pattern></defs>` + s;
  };
  $('lens').innerHTML = `<div class="hd"><span class="n">3</span><div><b>пр. Октября, 94 · вблизи</b><small>утро, 8:10 · пар над хлебом, витрина полная</small></div><div class="x"><span class="chip">${IC.search.replace('<svg', '<svg width="12" height="12"')}×4</span></div></div>
    <svg class="dio" width="452" height="236" viewBox="0 0 452 236">${dio()}</svg>
    <div class="st"><div><span class="caps">Очередь</span><b class="w">4 чел.</b></div><div><span class="caps">Продавцы</span><b>2 из 2</b></div><div><span class="caps">Усталость</span><b class="w">62 %</b></div><div><span class="caps">Витрина</span><b>86 %</b></div></div>
    <div class="tip">${IC.alert}Алсу устала: третий пик подряд без подмены<span class="btn">Нанять</span></div>`;

  // ---- правая панель ----
  const R = 38, C = 2 * Math.PI * R, pc = .742;
  $('quest').innerHTML = `<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="9"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--crust)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C * pc} ${C}" transform="rotate(-90 48 48)"/><text x="48" y="47" text-anchor="middle" font-family="var(--f-display)" font-size="19" font-weight="700" fill="var(--ink)">742</text><text x="48" y="63" text-anchor="middle" font-family="var(--f-mono)" font-size="10" fill="var(--ink-3)">из 1000</text></svg>
    <div><span class="caps">Веха недели · ещё 3 дня</span><h3>Накорми 1000 гостей за неделю</h3><div class="rw">${IC.trophy}Награда: рецепт «Бәлеш по-бабушкиному»</div></div>`;
  const qi = (ic, t, s, w, v, col) => `<div class="qi"><span class="ic">${IC[ic]}</span><div><b>${t}</b><span class="muted" style="font-size:11.5px">${s}</span><div class="pb"><i style="width:${w}%;background:${col || 'var(--good)'}"></i></div></div><span class="v">${v}</span></div>`;
  $('ql').innerHTML = qi('star', 'Выведи №5 на 5 ★', 'награда: известность района +5 %', 94, '4,7 ★') + qi('team', 'Месяц без увольнений', 'награда: культура +1', 60, '18 / 30 дн.') + qi('guests', 'Утренний пик без очереди', 'на №3 и №6 · награда: скидка на кофемашину', 35, '2 из 6 дн.', 'var(--warn)');
  const tl = (c, ic, t, w, n, col) => `<div class="tl"><span class="b ${c}">${IC[ic]}${t}</span><span class="bar2"><i style="width:${w}%;background:${col}"></i></span><span class="n">${n}</span></div>`;
  $('tl').innerHTML = tl('good', 'heart', 'вкусно!', 72, '×1 204', 'var(--good)') + tl('warn', 'clock', 'очередь', 38, '×640 · №3, №6', 'var(--warn)') + tl('bad', 'rub', 'дорого', 22, '×362 · №7', 'var(--bad)') + tl('warn', 'guests', 'нет круассанов', 14, '×231 · №9', 'var(--warn)');
  const hw = (svg, t) => `<div style="display:flex;gap:8px;align-items:center"><svg width="34" height="26" viewBox="0 0 34 26" style="flex:none">${svg}</svg><span>${t}</span></div>`;
  $('how').innerHTML =
    hw([0, 1, 2].map((i) => `<g transform="translate(${6 + i * 10},20)"><rect x="-3.4" y="-3" width="6.8" height="8" rx="3.2" fill="${PC[i]}" stroke="${INK}" stroke-width=".8"/><circle cx="0" cy="-6" r="3" fill="#efc9a4" stroke="${INK}" stroke-width=".8"/></g>`).join(''), 'человечки — очередь, их число = загрузка') +
    hw(ART.steam(17, 22, .6, .7), 'пар — свежая выпечка, утро') +
    hw(`<path d="M17 4 q5 7 0 10 q-5 -3 0 -10z" fill="#8fd0e0" stroke="${INK}" stroke-width="1"/>`, 'капля — продавцы устали') +
    hw(`<rect x="4" y="7" width="26" height="14" rx="3" fill="none" stroke="var(--ink-3)" stroke-dasharray="3 3"/>`, 'пустая витрина — к вечеру раскупили');
  $('snd').innerHTML = `<span class="chip">${IC.bell}Звук: тихо</span><span>касса, «дзынь» открытия, монетки 1-го числа</span>`;
</script>
</body>
</html>
