<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телефон — макет</title>
<link rel="stylesheet" href="common.css">
<style>
  body { position: relative; width: 390px; height: 844px; }
  svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mhud { position: absolute; left: 0; right: 0; top: 0; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 14px 10px; z-index: 3; }
  .r1 { display: flex; align-items: center; gap: 10px; }
  .r1 .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--crust); display: grid; place-items: center; }
  .r1 .logo svg { width: 17px; height: 17px; }
  .r1 .date { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; }
  .r1 .speed { margin-left: auto; }
  .r1 .speed span { width: 30px; height: 26px; }
  .r2 { display: grid; grid-template-columns: auto 1fr; gap: 16px; margin-top: 9px; align-items: end; }
  .r2 .caps { font-size: 8.5px; display: block; }
  .r2 .v { font-family: var(--f-mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .r2 .delta { font-size: 10.5px; margin-left: 4px; }
  .r2 .g .row { display: flex; justify-content: space-between; align-items: baseline; }
  .r2 .bar { margin-top: 5px; }
  .layers { position: absolute; top: 100px; left: 0; right: 0; display: flex; gap: 6px; padding: 0 14px; z-index: 2; overflow: hidden; }
  .layers span { flex: none; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 15px; font-size: 12.5px; font-weight: 500; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink-2); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .layers span svg { width: 14px; height: 14px; }
  .layers span.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .mapctl { position: absolute; right: 12px; top: 334px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
  .mapctl span { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); color: var(--ink-2); }
  .mapctl svg { width: 15px; height: 15px; }
  .north { position: absolute; left: 14px; top: 146px; z-index: 2; color: var(--ink-3); text-align: center; font-family: var(--f-display); font-size: 9px; font-weight: 600; }
  .scale { position: absolute; left: 14px; top: 396px; z-index: 2; font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3); }
  .scale .bars { display: flex; height: 5px; border: 1px solid var(--ink-3); margin-bottom: 2px; }
  .scale .bars i:nth-child(odd) { background: var(--ink-3); }

  .sheet { position: absolute; left: 0; right: 0; top: 424px; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.45); border-top: 1px solid var(--line-2); z-index: 4; overflow: hidden; }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 8px auto 6px; }
  .sh-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 10px; }
  .sh-h h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; }
  .sh-h span { font-size: 12px; color: var(--ink-3); }
  .kp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
  .kp .c { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .kp .lab { font-size: 11.5px; color: var(--ink-3); }
  .kp .v { font-family: var(--f-mono); font-size: 17px; font-weight: 600; margin: 2px 0 2px; }
  .kp .row { display: flex; justify-content: space-between; align-items: center; }
  .att { padding: 12px 16px 0; }
  .att .sec-h { margin-bottom: 4px; }
  .att .sec-h .count { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; background: var(--bad-soft); color: var(--bad-t); border-radius: 9px; padding: 1px 7px; margin-left: 6px; }
  .it { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .it:first-of-type { border-top: 0; }
  .it .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
  .it .ic svg { width: 16px; height: 16px; }
  .ic.bad { background: var(--bad-soft); color: var(--bad-t); } .ic.warn { background: var(--warn-soft); color: var(--warn-t); }
  .it .tt { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .it .ds { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .it .btn { height: 30px; padding: 0 11px; font-size: 12.5px; }

  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px 0; z-index: 5; }
  .nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-3); position: relative; padding-top: 4px; }
  .nav span svg { width: 22px; height: 22px; }
  .nav span.on { color: var(--crust-t); }
  .nav span.on:before { content: ''; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--crust); }
  .nav .badge { position: absolute; top: 0; left: 50%; margin-left: 6px; font-family: var(--f-mono); font-size: 9.5px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #1b0d0a; display: grid; place-items: center; padding: 0 4px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink-2); opacity: .6; z-index: 6; }
</style>
</head>
<body>
<svg class="map" id="map"></svg>
<div class="mhud">
  <div class="r1"><div class="logo" id="lg"></div><span class="date">14 мар 2039</span><div class="speed" id="spd"></div></div>
  <div class="r2">
    <div><span class="caps">Счёт</span><span class="v">2,84 млрд ₽</span><span class="delta up">▲ 2,6 %</span></div>
    <div class="g"><div class="row"><span class="caps">Оборот · цель 5 млрд</span><span class="delta" style="color:var(--crust-t)">82 %</span></div>
      <div class="row"><span class="v" style="font-size:13px">4,12 млрд</span></div>
      <div class="bar"><i style="width:82.4%"></i><span class="ms done" style="left:20%"></span><span class="ms done" style="left:50%"></span><span class="ms done" style="left:80%"></span></div></div>
  </div>
</div>
<div class="layers" id="layers"></div>
<div class="north"><svg width="18" height="26" viewBox="0 0 30 42"><circle cx="15" cy="27" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M15 2 L21 27 L15 23 L9 27Z" fill="currentColor"/></svg><div>С</div></div>
<div class="mapctl" id="ctl"></div>
<div class="scale" id="scale"></div>

<div class="sheet">
  <div class="grab"></div>
  <div class="sh-h"><h2>Сводка</h2><span>Выручка и прибыль · февраль</span></div>
  <div class="kp">
    <div class="c"><div class="lab">Выручка</div><div class="v">381,5 млн</div><div class="row"><span class="delta up">▲ 3,9 %</span><span id="s1"></span></div></div>
    <div class="c"><div class="lab">Прибыль · маржа 23 %</div><div class="v">88,4 млн</div><div class="row"><span class="delta up">▲ 5,2 %</span><span id="s2"></span></div></div>
  </div>
  <div class="att">
    <div class="sec-h"><h3>Требует внимания<span class="count">4</span></h3><span class="muted">Все →</span></div>
    <div id="att"></div>
  </div>
</div>
<nav class="nav" id="nav"></nav>
<div class="homebar"></div>

<script src="icons.js"></script>
<script src="map.js"></script>
<script>
  document.getElementById('lg').innerHTML = IC.loaf;
  const tri = (n) => `<svg width="${6 + n * 6}" height="10" viewBox="0 0 ${6 + n * 6} 10">${Array.from({ length: n }, (_, i) => `<path d="M${i * 6 + 1},1 L${i * 6 + 7},5 L${i * 6 + 1},9Z" fill="currentColor"/>`).join('')}</svg>`;
  document.getElementById('spd').innerHTML = [IC.pause.replace('<svg', '<svg width="12" height="12"'), tri(1), tri(2), tri(3)].map((s, i) => `<span class="${i === 1 ? 'on' : ''}">${s}</span>`).join('');
  const svg = document.getElementById('map');
  MK.render(svg, { vb: [90, 330, 620, 1342], k: 1.45, moodStroke: true, lk: 1.25, par: 'xMidYMin meet', labelDy: { center: -50, zaton: -50, glumilino: -46, inors: -48, sipaylovo: -46, dema: -16 }, labelDx: { glumilino: 24, zaton: -10, dema: 70 } });
  const L = [['Настроение', IC.mood], ['Прибыль', IC.rub], ['Штат', IC.team], ['Доставка', IC.truck]];
  document.getElementById('layers').innerHTML = `<span style="padding:0 9px">${IC.layers}</span>` + L.map(([n, i], j) => `<span class="${j === 0 ? 'on' : ''}">${i}${n}</span>`).join('');
  const hh = document.querySelector('.mhud').offsetHeight; document.getElementById('layers').style.top = (hh + 8) + 'px'; document.querySelector('.north').style.top = (hh + 50) + 'px';
  document.getElementById('ctl').innerHTML = `<span>${IC.plus}</span><span>${IC.minus}</span>`;
  const km = 33 * svg.getScreenCTM().a;
  document.getElementById('scale').innerHTML = `<div class="bars" style="width:${km}px"><i style="width:${km / 2}px;display:block;height:100%"></i></div>1 км`;
  document.getElementById('s1').innerHTML = MK.spark([298, 305, 311, 322, 318, 330, 341, 352, 349, 362, 367, 381.5], 56, 18);
  document.getElementById('s2').innerHTML = MK.spark([61, 66, 63, 70, 68, 74, 77, 81, 79, 83, 84, 88.4], 56, 18);
  const att = [
    ['bad', IC.team, 'Нехватка штата: 3 точки', '№12, №27, №31 · 38 чел. устали', 'Нанять 3', 'primary'],
    ['bad', IC.rub, '№41 в убытке 2-й месяц', 'Дёма · −1,2 млн ₽ за февраль', 'Открыть', ''],
    ['warn', IC.alert, 'Может уволиться через 6 дн.', 'Айдар Галиев, №31', 'Премия', ''],
  ];
  document.getElementById('att').innerHTML = att.map(([c, i, t, d, b, p]) => `<div class="it"><span class="ic ${c}">${i}</span><div><div class="tt">${t}</div><div class="ds">${d}</div></div><span class="btn ${p}">${b}</span></div>`).join('');
  const N = [['Сводка', IC.home], ['Точки', IC.store], ['Команда', IC.team, 3], ['Финансы', IC.chart], ['Ещё', IC.grid]];
  document.getElementById('nav').innerHTML = N.map(([n, i, b], j) => `<span class="${j === 0 ? 'on' : ''}">${i}${n}${b ? `<em class="badge">${b}</em>` : ''}</span>`).join('');
</script>
</body>
</html>
