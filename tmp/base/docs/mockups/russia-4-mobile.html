<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Россия на телефоне — макет</title>
<link rel="stylesheet" href="common.css">
<style>
  body { position: relative; width: 390px; height: 844px; background: var(--district); }
  svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mhud { position: absolute; left: 0; right: 0; top: 0; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 14px 10px; z-index: 3; }
  .r1 { display: flex; align-items: center; gap: 8px; }
  .r1 .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--crust); display: grid; place-items: center; flex: none; }
  .r1 .logo svg { width: 17px; height: 17px; }
  .crumbs { display: flex; align-items: center; gap: 3px; height: 30px; padding: 0 8px 0 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
  .crumbs svg { width: 14px; height: 14px; }
  .crumbs .h { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--ink); color: var(--paper); font-weight: 600; }
  .crumbs .s { color: var(--ink-3); display: grid; } .crumbs .s svg { width: 12px; height: 12px; }
  .crumbs .c { color: var(--ink-2); }
  .r1 .speed { margin-left: auto; }
  .r1 .speed span { width: 28px; height: 26px; }
  .r2 { display: grid; grid-template-columns: auto 1fr; gap: 16px; margin-top: 9px; align-items: end; }
  .r2 .caps { font-size: 8.5px; display: block; }
  .r2 .v { font-family: var(--f-mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .r2 .delta { font-size: 10.5px; margin-left: 4px; }
  .gl { display: grid; grid-template-columns: 44px 1fr 46px; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
  .gl b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--ink); text-align: right; }
  .gl .gb { position: relative; height: 5px; border-radius: 3px; background: var(--surface-3); }
  .gl .gb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--crust); }
  .layers { position: absolute; left: 0; right: 0; display: flex; gap: 6px; padding: 0 14px; z-index: 2; overflow: hidden; }
  .layers span { flex: none; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 15px; font-size: 12.5px; font-weight: 500; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink-2); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .layers span svg { width: 14px; height: 14px; }
  .layers span.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .mapctl { position: absolute; right: 12px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
  .mapctl span { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); color: var(--ink-2); }
  .mapctl svg { width: 15px; height: 15px; }
  .off { position: absolute; z-index: 2; display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); font-size: 11px; color: var(--ink-2); white-space: nowrap; box-shadow: var(--shadow); }
  .off svg { width: 12px; height: 12px; }
  .off.r { right: 0; border-right: 0; border-radius: 13px 0 0 13px; }
  .off.l { left: 0; border-left: 0; border-radius: 0 13px 13px 0; }
  .off .num { font-size: 10.5px; }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 84px; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.45); border-top: 1px solid var(--line-2); z-index: 4; overflow: hidden; }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 8px auto 6px; }
  .sh-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 8px; }
  .sh-h h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; }
  .sh-h span { font-size: 12px; color: var(--ink-3); }
  .strip { margin: 0 16px; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; }
  .strip > div { padding: 8px 12px; }
  .strip > div + div { border-left: 1px solid var(--line); }
  .strip .lab { font-size: 11px; color: var(--ink-3); }
  .strip .v { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }
  .strip .row { display: flex; justify-content: space-between; align-items: center; }
  .cities { display: flex; gap: 8px; padding: 10px 16px 2px; overflow: hidden; }
  .cc { flex: none; width: 120px; border: 1px solid var(--line); border-radius: 11px; padding: 8px 8px; display: grid; grid-template-columns: 28px 1fr; gap: 1px 7px; align-items: center; }
  .cc.act { border-color: color-mix(in srgb, var(--crust) 55%, transparent); }
  .cc .d { width: 26px; height: 26px; border-radius: 50%; background: var(--crust); color: var(--on-primary); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4.5px var(--ring); grid-row: span 2; margin-left: 2px; }
  .cc .n { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc .m { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
  .att { padding: 10px 16px 0; }
  .att .sec-h { margin-bottom: 2px; }
  .att .sec-h .count { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; background: var(--bad-soft); color: var(--bad-t); border-radius: 9px; padding: 1px 7px; margin-left: 6px; }
  .it { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .it:first-of-type { border-top: 0; }
  .it .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 9.5px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); position: relative; }
  .it .av.none { background: var(--bad-soft); color: var(--bad-t); font-family: var(--f-mono); font-size: 13px; }
  .it .av em { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 5px; display: grid; place-items: center; border: 1.5px solid var(--surface); }
  .it .av em svg { width: 8px; height: 8px; }
  .it .av em.warn { background: var(--warn); color: #1b1206; } .it .av em.info { background: var(--river); color: #0c1a1e; }
  .it .tt { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .it .ds { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .it .btn { height: 30px; padding: 0 11px; font-size: 12.5px; }

  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px 0; z-index: 5; }
  .nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-3); position: relative; padding-top: 4px; }
  .nav span svg { width: 22px; height: 22px; }
  .nav span.on { color: var(--crust-t); }
  .nav span.on:before { content: ''; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--crust); }
  .nav .badge { position: absolute; top: 0; left: 50%; margin-left: 6px; font-family: var(--f-mono); font-size: 9.5px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #1b0d0a; display: grid; place-items: center; padding: 0 4px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink-2); opacity: .6; z-index: 6; }
</style>
</head>
<body>
<svg class="map" id="map"></svg>
<div class="mhud">
  <div class="r1"><div class="logo" id="lg"></div><div class="crumbs" id="cr"></div><div class="speed" id="spd"></div></div>
  <div class="r2">
    <div><span class="caps">Счёт · 11 сен 2040</span><span class="v">3,62 млрд ₽</span><span class="delta up">▲ 2,8 %</span></div>
    <div><span class="caps">Цель · Федеральная сеть</span>
      <div class="gl"><span>Города</span><span class="gb"><i style="width:40%"></i></span><b>4/10</b></div>
      <div class="gl"><span>Оборот</span><span class="gb"><i style="width:26%"></i></span><b>10,4/40</b></div></div>
  </div>
</div>
<div class="layers" id="layers"></div>
<div class="mapctl" id="ctl"></div>
<div class="off l" id="offl"></div>
<div class="off r" id="offr"></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-h"><h2>Корпорация</h2><span>6 городов · 112 точек</span></div>
  <div class="strip">
    <div><div class="lab">Оборот · 12 мес.</div><div class="row"><span class="v">10,4 млрд</span><span id="s1"></span></div></div>
    <div><div class="lab">Прибыль · маржа 14 %</div><div class="row"><span class="v">1,46 млрд</span><span id="s2"></span></div></div>
  </div>
  <div class="cities" id="cities"></div>
  <div class="att">
    <div class="sec-h"><h3>Требует внимания<span class="count">4</span></h3><span class="muted">Отчёты →</span></div>
    <div id="att"></div>
  </div>
</div>
<nav class="nav" id="nav"></nav>
<div class="homebar"></div>

<script src="icons.js"></script>
<script src="map.js"></script>
<script src="russia.js"></script>
<script>
  document.getElementById('lg').innerHTML = IC.loaf;
  document.getElementById('cr').innerHTML = `<span class="h">${RU.GLOBE}Россия</span><span class="s">${IC.chevron}</span><span class="c">Уфа</span>`;
  const tri = (n) => `<svg width="${6 + n * 6}" height="10" viewBox="0 0 ${6 + n * 6} 10">${Array.from({ length: n }, (_, i) => `<path d="M${i * 6 + 1},1 L${i * 6 + 7},5 L${i * 6 + 1},9Z" fill="currentColor"/>`).join('')}</svg>`;
  document.getElementById('spd').innerHTML = [IC.pause.replace('<svg', '<svg width="12" height="12"'), tri(1), tri(2), tri(3)].map((s, i) => `<span class="${i === 1 ? 'on' : ''}">${s}</span>`).join('');
  const hh = document.querySelector('.mhud').offsetHeight;
  const sheet = document.getElementById('sheet');
  // сначала наполняем шторку, чтобы знать её высоту
  document.getElementById('s1').innerHTML = MK.spark([7.9, 8.1, 8.3, 8.5, 8.7, 8.9, 9.1, 9.4, 9.6, 9.9, 10.1, 10.4], 44, 16);
  document.getElementById('s2').innerHTML = MK.spark([1.19, 1.2, 1.24, 1.26, 1.25, 1.3, 1.33, 1.35, 1.38, 1.41, 1.43, 1.46], 44, 16);
  const ring = (o) => o.launch ? 'var(--crust)' : o.profit < 0 ? 'var(--bad)' : o.profit / o.rev >= 0.15 ? 'var(--good)' : 'var(--warn)';
  const CC = [['ufa', 'Уфа', '5,12 млрд'], ['kazan', 'Казань', '2,31 млрд'], ['chel', 'Челябинск', '1,52 млрд'], ['sterl', 'Стерлитамак', '780 млн']];
  document.getElementById('cities').innerHTML = CC.map(([id, n, r]) => { const o = RU.OWN[id]; const m = o.profit / o.rev * 100; return `<div class="cc ${o.active ? 'act' : ''}"><span class="d" style="--ring:${ring(o)}">${o.n}</span><span class="n">${n}</span><span class="m">${r}</span></div>`; }).join('');
  const att = [
    ['ДВ', 'warn', IC.alert, 'Челябинск: переманивают', 'Воронцов · лояльность 41 ▼', 'Мотивация', 'primary'],
    ['!', '', '', 'Самара без директора', 'Убыток −40 млн ₽ за 12 мес.', 'Назначить', ''],
    ['ГХ', 'info', IC.rub, 'Казань просит 48 млн', 'На 3 точки · до 1 октября', 'Ответить', ''],
  ];
  document.getElementById('att').innerHTML = att.map(([av, c, i, t, d, b, p]) => `<div class="it"><span class="av ${av === '!' ? 'none' : ''}">${av}${c ? `<em class="${c}">${i}</em>` : ''}</span><div><div class="tt">${t}</div><div class="ds">${d}</div></div><span class="btn ${p}">${b}</span></div>`).join('');
  const N = [['Россия', RU.GLOBE], ['Города', IC.store], ['Директора', IC.team], ['Отчёты', IC.chart, 3], ['Ещё', IC.grid]];
  document.getElementById('nav').innerHTML = N.map(([n, i, b], j) => `<span class="${j === 0 ? 'on' : ''}">${i}${n}${b ? `<em class="badge">${b}</em>` : ''}</span>`).join('');

  const sheetTop = 844 - sheet.offsetHeight;
  // карта: полоса от Москвы до Урала, видимая часть — между HUD и шторкой
  const W = 640, sc = 390 / W, topY = 336;             // верх видимой области ≈ широта 59,8°
  const vy = topY - (hh + 84) / sc;
  const svg = document.getElementById('map');
  RU.render(svg, {
    vb: [316, vy, W, 844 / sc], k: 1.0, nk: 1.35, bk: 1.35, lk: 1.35, geoLabels: false, par: 'xMinYMin meet', sheetEdge: false, kmLabels: false, gk: .6,
    otherLabels: ['perm', 'ekb', 'nn', 'volg', 'vrn'], activeTag: false,
    labelPos: {
      ufa: { dx: -1, a: 'end', oy: 2 }, sterl: { dx: 1, oy: 4 }, oren: { dx: 0, dy: 1, a: 'middle', oy: 10 }, samara: { dx: -1, a: 'end' },
      kazan: { dx: 0, dy: -1, a: 'middle' }, chel: { dx: 0, dy: -1, a: 'end', ox: 28, oy: -4 }, msk: { dx: 0, dy: 1, a: 'middle', oy: 8, ox: 14 }, perm: { dx: 1 }, ekb: { dx: -1, a: 'end', oy: -10 },
      nn: { dx: 0, dy: 1, a: 'middle', oy: 6 }, volg: { dx: 1 }, vrn: { dx: 1 },
    },
  });
  const L = [['Прибыль', IC.rub], ['Директора', IC.team], ['Потенциал', IC.target], ['Логистика', IC.truck]];
  const layers = document.getElementById('layers');
  layers.innerHTML = `<span style="padding:0 9px">${IC.layers}</span>` + L.map(([n, i], j) => `<span class="${j === 0 ? 'on' : ''}">${i}${n}</span>`).join('');
  layers.style.top = (hh + 8) + 'px';
  const ctl = document.getElementById('ctl'); ctl.innerHTML = `<span>${IC.plus}</span><span>${IC.minus}</span>`; ctl.style.top = (sheetTop - 88) + 'px';
  const nsk = RU.cityScreen(svg, 'nsk'), spb = RU.cityScreen(svg, 'spb');
  const offr = document.getElementById('offr'); offr.innerHTML = `Тюмень · Новосибирск${IC.chevron}`; offr.style.top = (hh + 48) + 'px';
  const offl = document.getElementById('offl'); offl.innerHTML = `${IC.back}<svg viewBox="-7 -9 14 17" style="width:10px;height:12px">${RU.LOCK('var(--ink-2)')}</svg>Москва · Петербург`; offl.style.top = (hh + 48) + 'px';
</script>
</body>
</html>
